{% load presentation %}
<article class="card camera-card">
  <div class="card-top"><span class="camera-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 10l4.5-2.5v9L15 14"/><rect x="3" y="6" width="12" height="12" rx="3"/></svg></span><span class="badge {% if camera.statut_appairage == 'revoked' %}danger{% elif not camera.est_connectee or not camera.surveillance_appliquee %}neutral{% endif %}">{{ camera|camera_summary }}</span></div>
  <h3><a href="{% url 'camera-detail' camera.pk %}">{{ camera.nom }}</a></h3>
  <p>{{ camera.maison.nom }}</p>
  <p class="muted">Voir la caméra <span aria-hidden="true">→</span></p>
</article>
