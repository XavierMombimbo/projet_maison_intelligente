{% extends "base.html" %}
{% block title %}Inscription{% endblock %}
{% block content %}
<div class="form-page">
  <section class="auth-card" aria-labelledby="signup-title"><h1 id="signup-title">Créer un compte</h1><p class="muted">Votre première étape pour surveiller votre maison.</p><form method="post" novalidate>{% csrf_token %}{{ form.as_p }}<button class="button" type="submit">Créer mon compte</button></form><p class="muted">Déjà inscrit ? <a class="text-link" href="{% url 'login' %}">Se connecter</a></p></section>
</div>
{% endblock %}
